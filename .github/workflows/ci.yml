name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_VERSION: 1.93.0
  ZELLIJ_VERSION: 0.45.1
  SNAPSHOT_VERSION: 0.2.3

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" \
            --profile minimal \
            --target wasm32-wasip1 \
            --component rustfmt \
            --component clippy \
            --no-self-update
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore snapshot tool
        id: snapshot-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/zellij-plugin-snapshot
          key: ${{ runner.os }}-zellij-plugin-snapshot-${{ env.SNAPSHOT_VERSION }}

      - name: Install snapshot tool
        if: steps.snapshot-cache.outputs.cache-hit != 'true'
        run: cargo install zellij-plugin-snapshot --version "$SNAPSHOT_VERSION" --locked

      - name: Install Zellij
        run: |
          archive="zellij-x86_64-unknown-linux-musl.tar.gz"
          checksum="zellij-x86_64-unknown-linux-musl.sha256sum"
          release_url="https://github.com/zellij-org/zellij/releases/download/v${ZELLIJ_VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$archive" \
            "$release_url/$archive"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$checksum" \
            "$release_url/$checksum"
          cd "$RUNNER_TEMP"
          tar -xzf "$archive"
          expected="$(awk 'NR == 1 { print $1 }' "$checksum")"
          actual="$(sha256sum zellij | awk '{ print $1 }')"
          [[ "$actual" == "$expected" ]]
          sudo install -m 0755 zellij /usr/local/bin/zellij
          zellij --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build WASM plugin
        run: ./scripts/build-wasm.sh

      - name: Verify snapshots
        run: ./scripts/check-snapshot.sh

      - name: Validate Zellij config
        run: zellij --config examples/config.kdl setup --check

      - name: Prepare artifact
        run: |
          test -s dist/pane-hud.wasm
          sha256sum dist/pane-hud.wasm |
            awk '{ print $1 "  pane-hud.wasm" }' > dist/pane-hud.wasm.sha256

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: pane-hud-wasm
          path: |
            dist/pane-hud.wasm
            dist/pane-hud.wasm.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: pane-hud-wasm
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/pane-hud.wasm \
              dist/pane-hud.wasm.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              dist/pane-hud.wasm \
              dist/pane-hud.wasm.sha256 \
              --verify-tag \
              --generate-notes \
              --title "pane-hud $tag" \
              --repo "$GITHUB_REPOSITORY"
          fi
