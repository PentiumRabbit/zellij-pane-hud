name: smoke
plugin: ../../dist/tree-hud.wasm
config:
  icons: nerd
  row_format: "{progress} {icon} {title}  {dir}"
world:
  current: demo
  sessions:
    - demo
geometry:
  rows: 20
  cols: 100
steps:
  - action: grant_permissions
  - action: session_update
    current: demo
    sessions:
      - demo
  - action: tab_update
    tabs:
      - name: code
        active: true
        tiled: 1
  - action: event_json
    json: '{"CommandChanged":[{"Terminal":1},["codex","--full-auto"],true,[]]}'
  - action: event_json
    json: '{"CommandChanged":[{"Terminal":2},["nvim","notes.md"],false,[]]}'
  - action: event_json
    json: '{"CommandChanged":[{"Terminal":3},["zsh"],false,[]]}'
  - action: event_json
    json: '{"CommandChanged":[{"Terminal":4},["bash"],false,[]]}'
  - action: event_json
    json: '{"CwdChanged":[{"Terminal":1},"/work/app/src/ui",[]]}'
  - action: event_json
    json: '{"CwdChanged":[{"Terminal":2},"/work/app/workspace/notes",[]]}'
  - action: event_json
    json: '{"CwdChanged":[{"Terminal":3},"/work/application",[]]}'
  - action: event_json
    json: '{"CwdChanged":[{"Terminal":4},"/work/app/logs",[]]}'
  - action: event_json
